name: Validate website

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: domain-preview
            base: /
            origin: https://www.dantongli.com
            indexable: 'false'
          - name: project-preview
            base: /website-preview/
            origin: https://dtlics.github.io
            indexable: 'false'
          - name: domain-release
            base: /
            origin: https://www.dantongli.com
            indexable: 'true'
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WEBSITE_BASE: ${{ matrix.base }}
      WEBSITE_ORIGIN: ${{ matrix.origin }}
      WEBSITE_INDEXABLE: ${{ matrix.indexable }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install the pinned package manager
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm verify
      - name: Preserve exact-case compatibility paths in the artifact
        env:
          WEBSITE_ARCHIVE: ${{ runner.temp }}/website-${{ matrix.name }}.tar
        run: |
          tar --create --file "$WEBSITE_ARCHIVE" --directory dist .
          python3 - <<'PY'
          import os
          import tarfile
          with tarfile.open(os.environ['WEBSITE_ARCHIVE']) as archive:
              names = {entry.name.removeprefix('./') for entry in archive.getmembers() if entry.isfile()}
              for path in [
                  'uploads/resume-dantong-li.pdf',
                  'uploads/Resume-Dantong-Li.pdf',
                  'publication/quantummeasurementsincompatibility/index.html',
                  'publication/QuantumMeasurementsIncompatibility/index.html',
                  'publication/quantummeasurementsincompatibility/cite.bib',
                  'publication/QuantumMeasurementsIncompatibility/cite.bib',
                  'publication/quantummeasurementsincompatibility/featured.png',
                  'publication/QuantumMeasurementsIncompatibility/featured.png',
              ]:
                  assert path in names, f'Missing compatibility path in artifact: {path}'
          PY
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/website-${{ matrix.name }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 7
