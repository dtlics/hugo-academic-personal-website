# Temporary compatibility for the existing site's branch and PR previews.
# GitHub Pages is the publication target. This file does not publish production.
[build]
  base = "."
  publish = "dist"
  ignore = "node -e \"process.exit(['deploy-preview','branch-deploy'].includes(process.env.CONTEXT) ? 1 : 0)\""
  command = "node -e \"if (!['deploy-preview','branch-deploy'].includes(process.env.CONTEXT)) { console.error('Only preview builds are enabled.'); process.exit(1); }\" && pnpm check && pnpm build && pnpm verify"

[build.environment]
  NODE_VERSION = "24.19.0"
  # package.json pins pnpm@11.25.0; Netlify reads it through Corepack.
  PNPM_FLAGS = "--frozen-lockfile"
  WEBSITE_BASE = "/"
  WEBSITE_ORIGIN = "https://www.dantongli.com"
  WEBSITE_INDEXABLE = "false"
  ASTRO_TELEMETRY_DISABLED = "1"
